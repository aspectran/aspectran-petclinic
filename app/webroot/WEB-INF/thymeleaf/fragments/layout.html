<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{templates/default :: template('plate solid', 'petclinic', ~{::content}, 'petclinic', '', '')}"
      th:fragment="layout(template, menu)">
<body>

<th:block th:fragment="content">
    <nav class="navbar navbar-expand-lg navbar-dark py-md-2 py-lg-0" role="navigation">
        <a class="navbar-brand mx-sm-auto ms-md-3" th:href="@{/}"><span></span></a>
        <button class="navbar-toggler me-2" type="button" data-bs-toggle="collapse" data-bs-target="#main-navbar" aria-controls="main-navbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse ps-lg-4" id="main-navbar">
            <ul class="navbar-nav me-auto" th:remove="all">
                <li th:fragment="menuItem(link, active, title, glyph, text)" class="nav-item">
                    <a th:class="${active == menu ? 'nav-link active' : 'nav-link'}"
                       th:href="@{__${link}__}"
                       th:title="${title}">
                        <i th:class="'bi bi-' + ${glyph} + ' me-1'" aria-hidden="true"></i>
                        <span th:text="${text}">Template</span>
                    </a>
                </li>
            </ul>

            <ul class="nav navbar-nav">
                <li th:replace="~{::menuItem ('/', 'home', 'home page', 'house', 'Home')}"></li>
                <li th:replace="~{::menuItem ('/owners/find', 'owners', 'find owners', 'search', 'Find owners')}"></li>
                <li th:replace="~{::menuItem ('/vets.html', 'vets', 'veterinarians', 'list-task', 'Veterinarians')}"></li>
                <li th:replace="~{::menuItem ('/oups', 'error', 'trigger a RuntimeException to see how it is handled', 'exclamation-triangle', 'Error')}"></li>
            </ul>
        </div>
    </nav>
    <div class="container py-4 px-3 px-lg-4 xd-container">
        <th:block th:insert="${template}" />
        <div class="row mt-5 pt-3 border-top">
            <div class="col-12 text-center">
                <img th:src="@{/images/spring-logo.svg}" alt="VMware Tanzu Logo" class="logo opacity-75">
            </div>
        </div>
    </div>
</th:block>

</body>
</html>
